[project]
name = "three_statement_model"
version = "0.1.0"
description = "Hand-built three-statement model and sensitivity CLI for researched companies (GULFOILLUB)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model*"]
