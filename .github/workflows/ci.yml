name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install LibreOffice Calc
        # P77: tests/test_excel_recalc.py recalculates the exported workbook
        # headless and compares it with model.linkage (skipped without soffice).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install
        # Editable install, so bare `pytest` can import the package (P8: `python
        # -m pytest` would mask a broken package by putting CWD on sys.path).
        run: pip install -e ".[dev]"

      - name: Tests
        # Offline against committed GULFOILLUB financials; no network involved.
        run: pytest -q
